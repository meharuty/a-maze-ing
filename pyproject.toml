[project]
name = "mazegen"
version = "1.0.0"
description = "A maze generator written in Python"
authors = [
    {name = "meharuty, ggevorgy"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyboard (>=0.13.5,<0.14.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
